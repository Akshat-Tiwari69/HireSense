name: Quality and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hiresense-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: bash -n deploy/deploy-hiresense deploy/hiresense-deploy-ssh
      - run: python database/validate_schema.py
      - run: ruff check backend
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check
        working-directory: frontend

  deploy:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install deployment key
        env:
          DEPLOY_KEY: ${{ secrets.HIRESENSE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HIRESENSE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy verified commit
        env:
          DEPLOY_HOST: ${{ secrets.HIRESENSE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HIRESENSE_DEPLOY_USER }}
        run: >-
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15
          -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST"
          "deploy $GITHUB_SHA"
