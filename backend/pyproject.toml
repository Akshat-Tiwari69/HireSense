[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
exclude = ["migrations", "scripts"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"admin_routes.py" = ["E402"]
"interviewee_routes.py" = ["E402"]
